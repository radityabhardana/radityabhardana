name: Update Daily GitHub Contribution Grid

on:
  schedule:
    # Run daily at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate Contribution Grid SVG
        run: node scripts/generate-contribution-grid.mjs

      - name: Commit and push if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/scenes/contribution-grid.svg
          if git diff --staged --quiet; then
            echo "No changes in contribution grid"
          else
            git commit -m "chore: update daily contribution grid [skip ci]"
            git push
          fi
