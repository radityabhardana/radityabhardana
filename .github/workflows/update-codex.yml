name: Update Engineering Codex Stats

on:
  schedule:
    # Run every 12 hours automatically
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - "assets/scenes/**"
      - "README.md"

permissions:
  contents: write

jobs:
  update-codex:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Codex Stats Updater
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/generate-codex-stats.mjs

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/scenes/codex-stats.svg
          git diff --staged --quiet || (git commit -m "chore(codex): auto-update souls & activity stats [skip ci]" && git push)
