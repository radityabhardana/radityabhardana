<svg width="900" height="36" viewBox="0 0 900 36" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">
  <style>
    .glow { animation: gl 3s step-end infinite; }
    @keyframes gl { 0%,100% {opacity:.55;} 50% {opacity:1;} }
  </style>

  <rect width="900" height="36" fill="#0d0d0d"/>

  <!-- pixel hairlines (dashed segments) -->
  <g fill="#3a2f1f">
    <rect x="100" y="17" width="40" height="2"/>
    <rect x="148" y="17" width="24" height="2"/>
    <rect x="180" y="17" width="40" height="2"/>
    <rect x="228" y="17" width="24" height="2"/>
    <rect x="260" y="17" width="40" height="2"/>
    <rect x="308" y="17" width="24" height="2"/>
    <rect x="340" y="17" width="40" height="2"/>
    <rect x="388" y="17" width="16" height="2"/>
    <rect x="496" y="17" width="16" height="2"/>
    <rect x="520" y="17" width="40" height="2"/>
    <rect x="568" y="17" width="24" height="2"/>
    <rect x="600" y="17" width="40" height="2"/>
    <rect x="648" y="17" width="24" height="2"/>
    <rect x="680" y="17" width="40" height="2"/>
    <rect x="728" y="17" width="24" height="2"/>
    <rect x="760" y="17" width="40" height="2"/>
  </g>

  <!-- line terminus dots -->
  <rect x="96" y="16" width="3" height="3" fill="#3a2f1f"/>
  <rect x="802" y="16" width="3" height="3" fill="#3a2f1f"/>

  <!-- PIXEL DIAMOND medallion (stepped) -->
  <g fill="#c9a876">
    <rect x="449" y="9" width="4" height="4"/>
    <rect x="453" y="13" width="4" height="4"/>
    <rect x="449" y="17" width="4" height="4"/>
    <rect x="445" y="13" width="4" height="4"/>
    <rect x="453" y="9" width="2" height="2"/>
    <rect x="457" y="11" width="2" height="2"/>
    <rect x="457" y="15" width="2" height="2"/>
    <rect x="453" y="21" width="2" height="2"/>
    <rect x="449" y="21" width="2" height="2"/>
    <rect x="445" y="15" width="2" height="2"/>
    <rect x="443" y="11" width="2" height="2"/>
    <rect x="447" y="9" width="2" height="2"/>
  </g>
  <!-- inner dark diamond -->
  <g fill="#1a1a1a">
    <rect x="451" y="14" width="2" height="2"/>
  </g>
  <!-- ember core (step-blink) -->
  <rect class="glow" x="450" y="13" width="4" height="4" fill="#f4a742"/>
  <rect class="glow" x="451" y="14" width="2" height="2" fill="#ffe9c4"/>

  <!-- blood accents -->
  <rect x="436" y="16" width="3" height="3" fill="#6e0d0d"/>
  <rect x="463" y="16" width="3" height="3" fill="#6e0d0d"/>

  <!-- pixel flourish steps -->
  <g fill="#3a2f1f">
    <rect x="424" y="15" width="4" height="2"/>
    <rect x="420" y="13" width="4" height="2"/>
    <rect x="416" y="11" width="4" height="2"/>
    <rect x="472" y="15" width="4" height="2"/>
    <rect x="476" y="13" width="4" height="2"/>
    <rect x="480" y="11" width="4" height="2"/>
    <rect x="424" y="19" width="4" height="2"/>
    <rect x="420" y="21" width="4" height="2"/>
    <rect x="416" y="23" width="4" height="2"/>
    <rect x="472" y="19" width="4" height="2"/>
    <rect x="476" y="21" width="4" height="2"/>
    <rect x="480" y="23" width="4" height="2"/>
  </g>
