<svg xmlns="http://www.w3.org/2000/svg" width="480" height="165" viewBox="0 0 480 165">
  <title>Spectre Terminal — Fintech · EV Calculus</title>
  <defs>
    <linearGradient id="cardBg_spectre" x1="0" y1="0" x2="0" y2="100%">
      <stop offset="0%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="topGlow_spectre" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c9a876" stop-opacity="0"/>
      <stop offset="35%" stop-color="#c9a876" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#e3b341" stop-opacity="0.7"/>
      <stop offset="65%" stop-color="#c9a876" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#c9a876" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <style>
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 15.5px;
      font-weight: 600;
      letter-spacing: 0.2px;
      fill: #f0f6fc;
    }
    .repo-name {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 11px;
      fill: #8b949e;
    }
    .desc-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 12.5px;
      line-height: 1.5;
      fill: #c9d1d9;
    }
    .meta-text {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 10.5px;
      letter-spacing: 0.3px;
      fill: #8b949e;
    }
    .link-text {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.5px;
      fill: #e3b341;
    }
  </style>

  <rect x="1" y="1" width="478" height="163" rx="6" fill="url(#cardBg_spectre)"/>
  <rect x="1" y="1" width="478" height="163" rx="6" fill="none" stroke="#30363d" stroke-width="1"/>
  <line x1="24" y1="1.5" x2="456" y2="1.5" stroke="url(#topGlow_spectre)" stroke-width="1.5"/>

  <g transform="translate(18, 20)">
    <rect width="46" height="46" rx="4" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
    
    <circle cx="23" cy="23" r="15" fill="none" stroke="#30363d" stroke-width="1.2"/>
    <path d="M9 23 C14 14, 32 14, 37 23 C32 32, 14 32, 9 23 Z" fill="none" stroke="#c9a876" stroke-width="1.5"/>
    <circle cx="23" cy="23" r="5.5" fill="#0d1117" stroke="#e3b341" stroke-width="1.3"/>
    <circle cx="23" cy="23" r="2" fill="#ffffff"/>
    <line x1="5" y1="23" x2="8" y2="23" stroke="#c9a876" stroke-width="1.5"/>
    <line x1="38" y1="23" x2="41" y2="23" stroke="#c9a876" stroke-width="1.5"/>
  
  </g>

  <text x="76" y="36" class="title-text">Spectre Terminal</text>
  <text x="76" y="54" class="repo-name">radityabhardana/spectre_terminal</text>

  <g transform="translate(460, 36)">
    <text text-anchor="end" class="meta-text">
      <tspan fill="#f1e05a" font-size="13">● </tspan>JavaScript
    </text>
  </g>

  <text x="76" y="82" class="desc-text">Polymarket intelligence terminal with mathematical expected-value</text>
  <text x="76" y="102" class="desc-text">guardrails designed for disciplined and deterministic trading decisions.</text>

  <line x1="18" y1="126" x2="462" y2="126" stroke="#21262d" stroke-width="1"/>

  <text x="18" y="146" class="meta-text">Polymarket · EV Math · Trading Terminal</text>
  <text x="462" y="146" text-anchor="end" class="link-text">VIEW REPO ↗</text>
</svg>
