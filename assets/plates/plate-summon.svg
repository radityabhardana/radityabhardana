<svg width="900" height="110" viewBox="0 0 900 110" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">
  <defs>
    <linearGradient id="platebg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1a1a1a"/>
      <stop offset="0.14" stop-color="#0d0d0d"/>
      <stop offset="0.86" stop-color="#0d0d0d"/>
      <stop offset="1" stop-color="#1a1a1a"/>
    </linearGradient>
  </defs>
  <style>
    .emberglow { animation: eb 4s step-end infinite; }
    @keyframes eb { 0%,100% {opacity:.4;} 50% {opacity:1;} }
  </style>

  <rect width="900" height="110" fill="url(#platebg)"/>

  <!-- pixel border frame: stepped top/bottom rows -->
  <g fill="#3a2f1f">
    <rect x="36" y="16" width="12" height="2"/>
    <rect x="56" y="16" width="772" height="2"/>
    <rect x="836" y="16" width="28" height="2"/>
    <rect x="40" y="91" width="12" height="2"/>
    <rect x="60" y="91" width="780" height="2"/>
    <rect x="848" y="91" width="12" height="2"/>
  </g>
  <!-- inner gold pixel line -->
  <g fill="#c9a876">
    <rect x="36" y="20" width="12" height="2"/>
    <rect x="56" y="20" width="764" height="2"/>
    <rect x="828" y="20" width="36" height="2"/>
    <rect x="40" y="87" width="12" height="2"/>
    <rect x="60" y="87" width="772" height="2"/>
    <rect x="840" y="87" width="20" height="2"/>
  </g>
  <!-- pixel corner brackets -->
  <g fill="#c9a876">
    <rect x="30" y="16" width="6" height="6"/>
    <rect x="30" y="22" width="2" height="6"/>
    <rect x="864" y="16" width="6" height="6"/>
    <rect x="868" y="22" width="2" height="6"/>
    <rect x="30" y="62" width="2" height="6"/>
    <rect x="30" y="68" width="6" height="6"/>
    <rect x="868" y="62" width="2" height="6"/>
    <rect x="864" y="68" width="6" height="6"/>
  </g>

  <!-- pixel keystone diamond + blinking ember glow -->
  <rect class="emberglow" x="442" y="12" width="16" height="16" fill="#f4a742" opacity="0.2"/>
  <g fill="#f4a742">
    <rect x="449" y="13" width="3" height="3"/>
    <rect x="452" y="16" width="3" height="3"/>
    <rect x="449" y="19" width="3" height="3"/>
    <rect x="446" y="16" width="3" height="3"/>
    <rect x="447" y="15" width="2" height="2" fill="#ffe9c4"/>
    <rect x="449" y="15" width="2" height="2" fill="#ffe9c4"/>
    <rect x="448" y="15" width="2" height="2" fill="#6e0d0d"/>
  </g>
  <rect class="emberglow" x="449" y="15" width="2" height="2" fill="#ffe9c4"/>

  <!-- numeral -->
  <text x="450" y="48" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-style="italic" fill="#6e0d0d" letter-spacing="10">VII</text>

  <!-- TITLE with pixel drop shadow -->
  <text x="452" y="70" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="bold" font-size="27" fill="#3a2f1f" letter-spacing="5" style="transform: translate(0,2px);" >SUMMON SIGN</text>
  <text x="450" y="68" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="bold" font-size="27" fill="#c9a876" letter-spacing="5">SUMMON SIGN</text>

  <!-- subtitle -->
  <text x="450" y="86" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11" font-style="italic" fill="#8a7455" letter-spacing="3">leave a mark, and the bell may answer</text>
</svg>