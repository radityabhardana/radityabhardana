<svg xmlns="http://www.w3.org/2000/svg" width="800" height="74" viewBox="0 0 800 74" shape-rendering="crispEdges">
  <title>CONTRIBUTIONS</title>
  <defs>
    <!-- Tapering Left Wing Gradient -->
    <linearGradient id="fadeL_IV" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c9a876" stop-opacity="0"/>
      <stop offset="60%" stop-color="#8a7455" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#f4a742" stop-opacity="1"/>
    </linearGradient>
    <!-- Tapering Right Wing Gradient -->
    <linearGradient id="fadeR_IV" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f4a742" stop-opacity="1"/>
      <stop offset="40%" stop-color="#8a7455" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#c9a876" stop-opacity="0"/>
    </linearGradient>
    <!-- Gold Text Shimmer -->
    <linearGradient id="goldText_IV" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff5cc"/>
      <stop offset="40%" stop-color="#f4a742"/>
      <stop offset="100%" stop-color="#c9a876"/>
    </linearGradient>
  </defs>

  <style>
    .crest-glow { animation: cPulse 2.4s ease-in-out infinite; }
    @keyframes cPulse {
      0%, 100% { opacity: 0.75; }
      50% { opacity: 1; }
    }
  </style>

  <!-- Left Horizontal Tapering Wing -->
  <line x1="40" y1="41" x2="205" y2="41" stroke="url(#fadeL_IV)" stroke-width="1.8"/>
  <rect x="209" y="39.5" width="4" height="4" fill="#f4a742"/>
  <rect x="217" y="38" width="6" height="6" fill="#c9a876"/>
  <line x1="227" y1="41" x2="235" y2="41" stroke="#f4a742" stroke-width="1.8"/>

  <!-- Right Horizontal Tapering Wing -->
  <line x1="565" y1="41" x2="573" y2="41" stroke="#f4a742" stroke-width="1.8"/>
  <rect x="577" y="38" width="6" height="6" fill="#c9a876"/>
  <rect x="587" y="39.5" width="4" height="4" fill="#f4a742"/>
  <line x1="595" y1="41" x2="760" y2="41" stroke="url(#fadeR_IV)" stroke-width="1.8"/>

  <!-- Top Center Roman Crest -->
  <g class="crest-glow">
    <polygon points="400,2 406,8 400,14 394,8" fill="#f4a742"/>
    <polygon points="400,4 403,8 400,12 397,8" fill="#fff5cc"/>
    <text x="400" y="24" font-family="'Press Start 2P', ui-monospace, monospace" font-size="10.5" font-weight="bold" fill="#f4a742" text-anchor="middle">IV</text>
  </g>

  <!-- Main Section Title (Prominent, Bold & Clear) -->
  <text x="400" y="48" font-family="'Press Start 2P', ui-monospace, monospace" font-size="19" letter-spacing="4.5" fill="url(#goldText_IV)" text-anchor="middle">CONTRIBUTIONS</text>

  <!-- Subtitle Caption (Crisp & Readable) -->
  <text x="400" y="67" font-family="ui-monospace, Consolas, monospace" font-size="11.5" font-weight="600" letter-spacing="3.5" fill="#c9a876" text-anchor="middle">GITHUB ACTIVITY &amp; EXPEDITIONS</text>
</svg>
