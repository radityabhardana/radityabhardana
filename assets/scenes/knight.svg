<svg width="400" height="340" viewBox="0 0 400 340" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="kfog" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#cfcfcf" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#cfcfcf" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bladegrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8a7455"/>
      <stop offset="0.5" stop-color="#c9a876"/>
      <stop offset="1" stop-color="#8a7455"/>
    </linearGradient>
  </defs>
  <style>
    .body { animation: breathe 4.5s ease-in-out infinite; transform-origin: 200px 318px; }
    @keyframes breathe {
      0%, 100% { transform: scale(1, 1); }
      50% { transform: scale(1.005, 1.018); }
    }
    .plume { animation: plume 3.4s ease-in-out infinite; transform-origin: 200px 84px; }
    @keyframes plume {
      0%, 100% { transform: rotate(-3.5deg); }
      50% { transform: rotate(5deg); }
    }
    .cape1 { animation: cape1 5.5s ease-in-out infinite; transform-origin: 186px 86px; }
    .cape2 { animation: cape2 5.5s ease-in-out infinite; transform-origin: 186px 86px; }
    .cape3 { animation: cape3 5.5s ease-in-out infinite; transform-origin: 184px 94px; }
    @keyframes cape1 {
      0%, 100% { transform: rotate(-2.5deg); }
      50% { transform: rotate(3.2deg); }
    }
    @keyframes cape2 {
      0%, 100% { transform: rotate(1.6deg); }
      50% { transform: rotate(-2.4deg); }
    }
    @keyframes cape3 {
      0%, 100% { transform: rotate(-1.4deg); }
      50% { transform: rotate(2deg); }
    }
    .eye { animation: eyeflare 4s ease-in-out infinite; }
    @keyframes eyeflare {
      0%, 78%, 100% { opacity: 0.3; }
      85% { opacity: 1; }
    }
    .bladeglow { animation: bladeglow 2.6s ease-in-out infinite; }
    @keyframes bladeglow {
      0%, 100% { opacity: 0.12; }
      55% { opacity: 0.75; }
    }
    .swoosh { animation: swoosh 2.6s ease-in-out infinite; }
    @keyframes swoosh {
      0%, 100% { opacity: 0; }
      45% { opacity: 0.9; }
      58% { opacity: 0; }
    }
    .ash1 { animation: ashfall 6s linear infinite 0s; }
    .ash2 { animation: ashfall 8s linear infinite 2s; }
    .ash3 { animation: ashfall 7s linear infinite 4s; }
    .ash4 { animation: ashfall 9s linear infinite 3s; }
    .ash5 { animation: ashfall 6.5s linear infinite 1.2s; }
    @keyframes ashfall {
      0% { opacity: 0; transform: translate(0px, -10px); }
      20% { opacity: 0.35; }
      80% { opacity: 0.22; }
      100% { opacity: 0; transform: translate(8px, 130px); }
    }
    .fogdrift { animation: fog 13s ease-in-out infinite; }
    @keyframes fog {
      0%, 100% { opacity: 0.4; transform: scaleX(1); }
      50% { opacity: 0.8; transform: scaleX(1.06); }
    }
  </style>

  <!-- background -->
  <rect width="400" height="340" fill="#0d0d0d"/>
  <ellipse cx="200" cy="300" rx="260" ry="60" fill="url(#kfog)"/>

  <!-- falling ash -->
  <g fill="#cfcfcf">
    <circle class="ash1" cx="110" cy="10" r="1"/>
    <circle class="ash2" cx="150" cy="10" r="1.1"/>
    <circle class="ash3" cx="250" cy="10" r="0.9"/>
    <circle class="ash4" cx="290" cy="10" r="1.2"/>
    <circle class="ash5" cx="320" cy="10" r="1"/>
  </g>

  <g class="body">

    <!-- cape (tattered, three swaying segments) -->
    <g fill="#151515" stroke="#c9a876" stroke-width="1.2">
      <path class="cape1" d="M196 84 L146 120 L128 170 L120 232 L150 258 L158 210 L176 240 L196 262 Z" opacity="0.95"/>
      <path class="cape2" d="M196 84 L158 116 L150 170 L160 220 L176 246 L196 180 Z" opacity="0.8"/>
      <path class="cape3" d="M204 84 L238 116 L258 168 L250 220 L238 246 L204 190 Z" opacity="0.9"/>
      <path class="cape3" d="M204 84 L244 112 L268 162 L282 214 L262 250 L244 208 L204 158 Z" opacity="0.7"/>
    </g>

    <!-- planted greatsword -->
    <g>
      <!-- tip in ground + blade -->
      <path d="M196 318 L196 150 L204 150 L204 318 Z" fill="url(#bladegrad)"/>
      <path d="M196 318 L196 150 L200 150 L200 318 Z" fill="#0d0d0d" opacity="0.35"/>
      <line x1="200" y1="306" x2="200" y2="160" stroke="#f4a742" stroke-width="1" class="bladeglow" opacity="0.4"/>
      <!-- curved crossguard -->
      <path d="M182 168 Q196 158 204 168 Q204 176 201 178 Q196 171 190 172 Q186 174 184 176 Z" fill="#c9a876"/>
      <path d="M218 168 Q204 158 196 168 Q196 176 199 178 Q204 171 210 172 Q214 174 216 176 Z" fill="#c9a876"/>
      <rect x="194" y="176" width="12" height="7" fill="#3a2f1f" rx="1.5" stroke="#c9a876" stroke-width="0.8"/>
      <!-- wrapped grip -->
      <path d="M196 183 L204 183 L203 206 L197 206 Z" fill="#3a2f1f"/>
      <path d="M196 189 L204 188.5 M196 194 L204 193.5 M196 199 L204 198.5 M197 203 L203 202.5" stroke="#6e0d0d" stroke-width="1"/>
      <!-- pommel -->
      <circle cx="200" cy="211" r="4.5" fill="#c9a876" stroke="#0d0d0d" stroke-width="0.8"/>
      <circle class="swoosh" cx="200" cy="211" r="7" fill="none" stroke="#f4a742" stroke-width="1" opacity="0"/>
    </g>

    <!-- legs + sabatons -->
    <path d="M186 268 L180 318 L190 318 L194 274 Z" fill="#151515" stroke="#c9a876" stroke-width="1"/>
    <path d="M212 268 L206 318 L216 318 L220 274 Z" fill="#151515" stroke="#c9a876" stroke-width="1"/>
    <path d="M178 312 L178 322 L194 322 L196 312 Z" fill="#1f1f1f" stroke="#c9a876" stroke-width="1"/>
    <path d="M208 312 L208 322 L224 322 L226 312 Z" fill="#1f1f1f" stroke="#c9a876" stroke-width="1"/>

    <!-- torso breastplate -->
    <path d="M184 262 C176 240 172 206 178 180 L196 164 L210 164 L226 180 C232 206 228 240 220 262 Z" fill="#1a1a1a" stroke="#c9a876" stroke-width="1.5"/>
    <path d="M196 166 L200 232 L204 232 L210 166 Z" fill="none" stroke="#c9a876" stroke-width="0.8" opacity="0.6"/>
    <path d="M178 220 L226 220" stroke="#3a2f1f" stroke-width="1.2" opacity="0.9"/>

    <!-- layered pauldrons -->
    <path d="M172 168 C160 164 152 170 150 184 L166 194 L172 180 Z" fill="#1f1f1f" stroke="#c9a876" stroke-width="1.2"/>
    <path d="M232 168 C244 164 252 170 254 184 L238 194 L232 180 Z" fill="#1f1f1f" stroke="#c9a876" stroke-width="1.2"/>
    <path d="M154 196 C146 194 142 200 143 210 L158 214 Z" fill="#1a1a1a" stroke="#c9a876" stroke-width="1"/>
    <path d="M250 196 C258 194 262 200 261 210 L246 214 Z" fill="#1a1a1a" stroke="#c9a876" stroke-width="1"/>

    <!-- gorget -->
    <path d="M182 164 L182 172 L222 172 L222 164 Z" fill="#1f1f1f" stroke="#c9a876" stroke-width="1"/>

    <!-- great helm with twin horns -->
    <path d="M190 164 L190 96 C190 82 196 74 200 74 C204 74 210 82 210 96 L210 164 Z" fill="#1a1a1a" stroke="#c9a876" stroke-width="1.5"/>
    <path d="M200 74 C196 70 190 66 184 66 C188 76 192 80 198 82 Z" fill="#1a1a1a" stroke="#c9a876" stroke-width="1.2"/>
    <path d="M200 74 C204 70 210 66 216 66 C212 76 208 80 202 82 Z" fill="#1a1a1a" stroke="#c9a876" stroke-width="1.2"/>
    <path d="M184 66 L178 54 L186 56 Z" fill="#1a1a1a" stroke="#c9a876" stroke-width="1.2"/>
    <path d="M216 66 L222 54 L214 56 Z" fill="#1a1a1a" stroke="#c9a876" stroke-width="1.2"/>

    <!-- visor slit -->
    <path d="M192 116 Q200 112 208 116 L207 128 Q200 132 193 128 Z" fill="#0d0d0d" stroke="#6e0d0d" stroke-width="1.2"/>
    <circle class="eye" cx="196" cy="122" r="2" fill="#f4a742"/>
    <circle class="eye" cx="204" cy="122" r="2" fill="#f4a742"/>

    <!-- tattered plume -->
    <path class="plume" d="M200 74 C192 64 194 52 204 46 C212 52 208 64 202 72 Z" fill="#c9a876"/>
    <path class="plume" d="M202 72 C210 64 214 56 212 48 C204 52 200 60 200 68 Z" fill="#a0855c" opacity="0.8"/>

    <!-- planted hands on crossguard -->
    <circle cx="184" cy="176" r="5" fill="#1a1a1a" stroke="#c9a876" stroke-width="1"/>
    <circle cx="216" cy="176" r="5" fill="#1a1a1a" stroke="#c9a876" stroke-width="1"/>
  </g>

  <!-- ground fog drifting -->
  <ellipse class="fogdrift" cx="200" cy="318" rx="150" ry="14" fill="#cfcfcf" opacity="0.4"/>
  <ellipse cx="200" cy="322" rx="90" ry="8" fill="#0d0d0d" opacity="0.5"/>
</svg>