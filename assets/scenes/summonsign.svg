<svg width="500" height="200" viewBox="0 0 500 200" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">
  <style>
    .r1 { animation: pr1 3.4s step-end infinite; }
    .r2 { animation: pr2 3.4s step-end infinite; }
    .r3 { animation: pr3 3.8s step-end infinite; }
    @keyframes pr1 { 0%,100% {opacity:.45;} 50% {opacity:1;} }
    @keyframes pr2 { 0%,100% {opacity:1;} 50% {opacity:.35;} }
    @keyframes pr3 { 0%,100% {opacity:.6;} 50% {opacity:.2;} }
    .sweep { animation: pw 3.8s step-end infinite; }
    @keyframes pw { 0% {stroke-dashoffset:1200;} 25% {stroke-dashoffset:1000;} 50% {stroke-dashoffset:800;} 75% {stroke-dashoffset:600;} 100% {stroke-dashoffset:0;} }
    .gp { animation: gh 2.8s step-end infinite; transform-origin: 250px 112px; }
    @keyframes gh { 0%,100% {opacity:.5;} 32% {opacity:1;} 60% {opacity:.75;} 85% {opacity:1;} }
    .sp1 { animation: sk1 3.8s step-end infinite; }
    .sp2 { animation: sk2 4.6s step-end infinite; }
    .sp3 { animation: sk3 5.2s step-end infinite; }
    .sp4 { animation: sk4 4.2s step-end infinite; }
    @keyframes sk1 { 0%,88%,100% {opacity:0;} 95% {opacity:1;} }
    @keyframes sk2 { 0%,90%,100% {opacity:0;} 96% {opacity:1;} }
    @keyframes sk3 { 0%,84%,100% {opacity:0;} 92% {opacity:1;} }
    @keyframes sk4 { 0%,86%,100% {opacity:0;} 94% {opacity:1;} }
    .d1 { animation: dd 8s step-end infinite 0s; }
    .d2 { animation: dd 10s step-end infinite 3s; }
    .d3 { animation: dd 12s step-end infinite 6s; }
    @keyframes dd { 0% {opacity:0;transform:translate(0,0);} 25% {opacity:.5;transform:translate(-3px,-12px);} 50% {opacity:.35;transform:translate(-6px,-24px);} 75% {opacity:.2;transform:translate(-9px,-36px);} 100% {opacity:0;transform:translate(-12px,-48px);} }
    .blink { animation: bl 1.3s step-end infinite; }
    @keyframes bl { 0%,100% {opacity:1;} 50% {opacity:.3;} }
  </style>

  <!-- dark ground -->
  <rect width="500" height="200" fill="#0d0d0d"/>
  <!-- ground tile dither -->
  <g fill="#151515">
    <rect x="30" y="150" width="24" height="6"/>
    <rect x="60" y="162" width="24" height="6"/>
    <rect x="420" y="148" width="24" height="6"/>
    <rect x="450" y="160" width="24" height="6"/>
    <rect x="200" y="168" width="30" height="6"/>
    <rect x="300" y="164" width="30" height="6"/>
  </g>
  <!-- light spill dither (warm) -->
  <g fill="#3a2a18">
    <rect x="150" y="64" width="18" height="6"/>
    <rect x="120" y="78" width="24" height="6"/>
    <rect x="330" y="64" width="18" height="6"/>
    <rect x="354" y="78" width="24" height="6"/>
    <rect x="162" y="120" width="12" height="6"/>
    <rect x="324" y="120" width="12" height="6"/>
    <rect x="96" y="100" width="12" height="6"/>
    <rect x="390" y="100" width="12" height="6"/>
  </g>

  <!-- outer aura (blinking) -->
  <rect x="40" y="40" width="420" height="120" fill="none" stroke="#f4a742" stroke-width="2" class="blink" opacity="0.4"/>

  <!-- concentric PIXEL rings (stepped corners) -->
  <g fill="none" stroke-width="2">
    <rect class="r1" x="50" y="42" width="400" height="116" stroke="#c9a876" opacity="0.5"/>
    <rect class="r1" x="50" y="42" width="400" height="116" stroke="#ffe9c4" stroke-width="1" opacity="0.4"/>
    <rect class="r2" x="76" y="62" width="348" height="76" stroke="#c9a876" opacity="0.7"/>
    <rect class="r3" x="102" y="78" width="296" height="44" stroke="#c9a876" opacity="0.6"/>
    <rect class="r3" x="128" y="90" width="244" height="20" stroke="#c9a876" opacity="0.5"/>
  </g>

  <!-- shimmer sweep (dashed pixel perimeter) -->
  <path class="sweep" d="M50 42 H450 A46 46 0 0 1 450 158 H50 A46 46 0 0 1 50 42 Z" fill="none" stroke="#f4a742" stroke-width="3" stroke-dasharray="1200" stroke-dashoffset="1200" shape-rendering="crispEdges"/>

  <!-- runic glyph core (pixel font runes) -->
  <g class="gp">
    <rect x="205" y="90" width="90" height="44" fill="#0d0d0d" stroke="#f4a742" stroke-width="1"/>
    <g fill="none" stroke="#cfcfcf" stroke-width="2">
      <path d="M216 98 h5 v4 h-5 Z"/>
      <path d="M224 98 h5 v4 h-5 Z"/>
      <path d="M232 98 h5 v4 h-5 Z"/>
      <path d="M216 106 h17 v4 h-17 Z"/>
      <path d="M240 98 h5 v4 h-5 Z"/>
      <path d="M248 98 h5 v4 h-5 Z"/>
      <path d="M256 98 h5 v4 h-5 Z"/>
      <path d="M240 106 h21 v4 h-21 Z"/>
      <path d="M234 120 h5 v-4 h-5 Z"/>
      <path d="M242 120 h5 v-4 h-5 Z"/>
      <path d="M250 120 h5 v-4 h-5 Z"/>
      <path d="M258 120 h5 v-4 h-5 Z"/>
      <path d="M234 114 h29 v4 h-29 Z"/>
      <path d="M266 114 h5 v4 h-5 Z"/>
    </g>
  </g>

  <!-- ember sparks at corners (hopping) -->
  <g fill="#f4a742">
    <rect class="sp1" x="196" y="50" width="6" height="6"/>
    <rect class="sp2" x="300" y="50" width="6" height="6"/>
    <rect class="sp3" x="196" y="144" width="6" height="6"/>
    <rect class="sp4" x="300" y="144" width="6" height="6"/>
  </g>

  <!-- floating dust -->
  <g fill="#ffe9c4">
    <rect class="d1" x="180" y="120" width="4" height="4" opacity="0.5"/>
    <rect class="d2" x="320" y="110" width="4" height="4" opacity="0.4"/>
    <rect class="d3" x="250" y="70" width="4" height="4" opacity="0.45"/>
  </g>
</svg>