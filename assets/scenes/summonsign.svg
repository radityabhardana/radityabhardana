<svg width="500" height="200" viewBox="0 0 500 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bloom" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f4a742" stop-opacity="0.4"/>
      <stop offset="0.55" stop-color="#f4a742" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#f4a742" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <style>
    .boom { animation: bloom 3.2s ease-in-out infinite; transform-origin: 250px 100px; }
    @keyframes bloom {
      0%, 100% { opacity: 0.5; transform: scale(1); }
      50% { opacity: 0.95; transform: scale(1.05); }
    }
    .aura { animation: aura 4.4s ease-in-out infinite; transform-origin: 250px 100px; }
    @keyframes aura {
      0%, 100% { opacity: 0.32; }
      50% { opacity: 0.62; }
    }
    .R1 { animation: ringR 3.4s ease-in-out infinite; }
    .R2 { animation: ringR 3.4s ease-in-out infinite; animation-delay: 0.4s; }
    .R3 { animation: ringR 3.4s ease-in-out infinite; animation-delay: 0.8s; }
    .R2s { animation: ringR2 3.8s ease-in-out infinite; animation-delay: 1.2s; }
    @keyframes ringR {
      0%, 100% { opacity: 0.45; }
      50% { opacity: 1; }
    }
    @keyframes ringR2 {
      0%, 100% { opacity: 0.7; }
      50% { opacity: 0.28; }
    }
    .sweep { animation: sweep 3.8s linear infinite; }
    @keyframes sweep {
      0% { stroke-dashoffset: 1200; }
      55% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: 0; }
    }
    .glyph { stroke: #cfcfcf; stroke-width: 1.7; stroke-linecap: round; fill: none; }
    .glyphPulse { animation: heartpulse 2.8s ease-in-out infinite; transform-origin: 250px 112px; }
    @keyframes heartpulse {
      0%, 100% { opacity: 0.45; transform: scale(1); }
      32% { opacity: 1; transform: scale(1.035); }
      46% { opacity: 0.7; transform: scale(1.01); }
      60% { opacity: 1; transform: scale(1.028); }
    }
    .sparkL { animation: sparkL 3.8s ease-in-out infinite; }
    .sparkT { animation: sparkT 4.6s ease-in-out infinite; animation-delay: 1.1s; }
    .sparkN { animation: sparkN 5.2s ease-in-out infinite; animation-delay: 2.3s; }
    .sparkR { animation: sparkR 4.2s ease-in-out infinite; animation-delay: 1.8s; }
    @keyframes sparkL {
      0%, 88%, 100% { opacity: 0; transform: scale(0.4); }
      95% { opacity: 1; transform: scale(1.15); }
    }
    @keyframes sparkT {
      0%, 90%, 100% { opacity: 0; transform: scale(0.4); }
      96% { opacity: 1; transform: scale(1.1); }
    }
    @keyframes sparkN {
      0%, 84%, 100% { opacity: 0; transform: scale(0.4); }
      92% { opacity: 1; transform: scale(1.25); }
    }
    @keyframes sparkR {
      0%, 86%, 100% { opacity: 0; transform: scale(0.4); }
      94% { opacity: 1; transform: scale(1.2); }
    }
  </style>

  <!-- dark ground -->
  <rect width="500" height="200" fill="#0d0d0d"/>
  <ellipse cx="250" cy="98" rx="230" ry="72" fill="url(#bloom)"/>

  <!-- outer aura -->
  <g fill="none">
    <ellipse class="aura" cx="250" cy="100" rx="214" ry="62" stroke="#f4a742" stroke-width="3" opacity="0.3"/>
    <ellipse cx="250" cy="100" rx="228" ry="70" stroke="#f4a742" stroke-width="8" opacity="0.07"/>
  </g>

  <!-- concentric rounded-rect rings -->
  <g fill="none" stroke="#c9a876">
    <rect class="R1" x="52" y="42" width="396" height="116" rx="46" stroke-width="5" opacity="0.5"/>
    <rect class="R2" x="78" y="62" width="344" height="76" rx="30" stroke-width="4" opacity="0.7"/>
    <rect class="R2s" x="102" y="78" width="296" height="44" rx="18" stroke-width="3" opacity="0.6"/>
    <rect class="R3" x="128" y="90" width="244" height="20" rx="8" stroke-width="2" opacity="0.5"/>
  </g>

  <!-- shimmer highlight traveling the perimeter -->
  <path class="sweep" d="M52 42 H448 A46 46 0 0 1 448 158 H52 A46 46 0 0 1 52 42 Z" fill="none" stroke="#f4a742" stroke-width="2.5" stroke-dasharray="1200" stroke-dashoffset="1200" opacity="0.9"/>

  <!-- runic glyph cluster at core -->
  <g class="glyphPulse">
    <rect x="210" y="92" width="80" height="40" rx="6" fill="#0d0d0d" stroke="#f4a742" stroke-width="1.6" opacity="0.7"/>
    <g class="glyph">
      <path d="M218 104 l8 8 -8 8"/>
      <path d="M230 104 l10 16"/>
      <path d="M248 104 l-6 16"/>
      <path d="M248 104 h6 M240 116 h10"/>
      <path d="M258 104 h8 M258 120 h8"/>
      <path d="M270 104 l-8 8 8 8"/>
      <path d="M262 102 v14 M262 109 h6"/>
    </g>
    <circle cx="216" cy="112" r="1.4" fill="#f4a742" opacity="0.8"/>
    <circle cx="284" cy="112" r="1.4" fill="#f4a742" opacity="0.8"/>
  </g>

  <!-- occasional ember sparks at ring corners -->
  <g fill="#f4a742">
    <circle class="sparkL" cx="78" cy="62" r="2"/>
    <circle class="sparkT" cx="422" cy="62" r="1.8"/>
    <circle class="sparkN" cx="78" cy="138" r="1.6"/>
    <circle class="sparkR" cx="422" cy="138" r="2"/>
  </g>

  <ellipse cx="250" cy="176" rx="150" ry="10" fill="#0d0d0d" opacity="0.55"/>
</svg>