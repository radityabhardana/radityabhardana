<svg xmlns="http://www.w3.org/2000/svg" width="600" height="340" viewBox="0 0 600 340" shape-rendering="crispEdges">
  <title>Dark Souls — Bonfire Lit</title>
  <defs>
    <!-- Ambient Radial Fire Glow -->
    <radialGradient id="fireLight" cx="50%" cy="68%" r="55%">
      <stop offset="0%" stop-color="#ff7b00" stop-opacity="0.45"/>
      <stop offset="35%" stop-color="#d94e00" stop-opacity="0.22"/>
      <stop offset="70%" stop-color="#731f00" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#080706" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ashGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff9900" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#cc3300" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="groundFade" x1="0" y1="0" x2="0" y2="100%">
      <stop offset="0%" stop-color="#080706"/>
      <stop offset="100%" stop-color="#050404"/>
    </linearGradient>
  </defs>

  <style>
    /* Fire Breathing Ambient Glow */
    .ambient-pulse { animation: ambGlow 1.8s ease-in-out infinite; }
    @keyframes ambGlow {
      0%, 100% { opacity: 0.65; transform: scale(1); transform-origin: 300px 220px; }
      50% { opacity: 0.95; transform: scale(1.08); transform-origin: 300px 220px; }
    }

    /* 4-Frame Retro Pixel Flame Animation (0.6s total loop = 6.6 FPS) */
    .f-layer-1 { animation: flameLoop1 0.6s step-end infinite; }
    .f-layer-2 { animation: flameLoop2 0.6s step-end infinite; }
    .f-layer-3 { animation: flameLoop3 0.6s step-end infinite; }
    .f-layer-4 { animation: flameLoop4 0.6s step-end infinite; }

    @keyframes flameLoop1 {
      0% { opacity: 1; }
      25% { opacity: 0; }
      50% { opacity: 0; }
      75% { opacity: 0; }
      100% { opacity: 1; }
    }
    @keyframes flameLoop2 {
      0% { opacity: 0; }
      25% { opacity: 1; }
      50% { opacity: 0; }
      75% { opacity: 0; }
      100% { opacity: 0; }
    }
    @keyframes flameLoop3 {
      0% { opacity: 0; }
      25% { opacity: 0; }
      50% { opacity: 1; }
      75% { opacity: 0; }
      100% { opacity: 0; }
    }
    @keyframes flameLoop4 {
      0% { opacity: 0; }
      25% { opacity: 0; }
      50% { opacity: 0; }
      75% { opacity: 1; }
      100% { opacity: 0; }
    }

    /* Sword Heat Pulse */
    .blade-heat { animation: heatPulse 1.4s ease-in-out infinite; }
    @keyframes heatPulse {
      0%, 100% { opacity: 0.75; }
      50% { opacity: 1; }
    }

    /* Rising Cinder Embers */
    .ember-1 { animation: eRise1 3.2s linear infinite; }
    .ember-2 { animation: eRise2 3.8s linear infinite 0.5s; }
    .ember-3 { animation: eRise3 2.9s linear infinite 1.1s; }
    .ember-4 { animation: eRise4 4.1s linear infinite 1.7s; }
    .ember-5 { animation: eRise1 3.5s linear infinite 2.3s; }
    .ember-6 { animation: eRise2 3.1s linear infinite 0.9s; }
    .ember-7 { animation: eRise3 4.4s linear infinite 1.4s; }

    @keyframes eRise1 {
      0% { transform: translate(0, 0); opacity: 0; }
      20% { opacity: 1; }
      70% { transform: translate(-18px, -80px); opacity: 0.6; }
      100% { transform: translate(-32px, -150px); opacity: 0; }
    }
    @keyframes eRise2 {
      0% { transform: translate(0, 0); opacity: 0; }
      20% { opacity: 1; }
      70% { transform: translate(16px, -75px); opacity: 0.7; }
      100% { transform: translate(28px, -145px); opacity: 0; }
    }
    @keyframes eRise3 {
      0% { transform: translate(0, 0); opacity: 0; }
      25% { opacity: 0.9; }
      70% { transform: translate(-8px, -90px); opacity: 0.5; }
      100% { transform: translate(-14px, -165px); opacity: 0; }
    }
    @keyframes eRise4 {
      0% { transform: translate(0, 0); opacity: 0; }
      25% { opacity: 0.9; }
      70% { transform: translate(22px, -85px); opacity: 0.5; }
      100% { transform: translate(38px, -155px); opacity: 0; }
    }

    /* Rising Smoke Puffs */
    .smoke-puff-1 { animation: smkRise 5.2s linear infinite 0.2s; }
    .smoke-puff-2 { animation: smkRise 6.1s linear infinite 2.6s; }
    @keyframes smkRise {
      0% { transform: translate(0, 0) scale(1); opacity: 0; }
      20% { opacity: 0.35; }
      80% { opacity: 0.15; }
      100% { transform: translate(14px, -110px) scale(1.6); opacity: 0; }
    }

    /* Bonfire Lit Banner Text Glow */
    .text-lit { animation: litPulse 2.8s ease-in-out infinite; }
    @keyframes litPulse {
      0%, 100% { opacity: 0.75; }
      50% { opacity: 1; text-shadow: 0 0 8px #f4a742; }
    }
  </style>

  <!-- Deep Abyss Background -->
  <rect width="600" height="340" fill="url(#groundFade)"/>

  <!-- Cathedral Stone Ground Pavers -->
  <g fill="#14110e" opacity="0.8">
    <rect x="0" y="240" width="600" height="100"/>
    <!-- Flagstone joints -->
    <line x1="0" y1="240" x2="600" y2="240" stroke="#211c16" stroke-width="2"/>
    <line x1="0" y1="285" x2="600" y2="285" stroke="#1c1712" stroke-width="2"/>
    <line x1="90" y1="240" x2="90" y2="285" stroke="#1c1712" stroke-width="2"/>
    <line x1="220" y1="240" x2="220" y2="285" stroke="#1c1712" stroke-width="2"/>
    <line x1="390" y1="240" x2="390" y2="285" stroke="#1c1712" stroke-width="2"/>
    <line x1="510" y1="240" x2="510" y2="285" stroke="#1c1712" stroke-width="2"/>
    <line x1="160" y1="285" x2="160" y2="340" stroke="#17130e" stroke-width="2"/>
    <line x1="320" y1="285" x2="320" y2="340" stroke="#17130e" stroke-width="2"/>
    <line x1="450" y1="285" x2="450" y2="340" stroke="#17130e" stroke-width="2"/>
  </g>

  <!-- Ambient Pulsing Radiance Pool on the Floor -->
  <ellipse class="ambient-pulse" cx="300" cy="225" rx="230" ry="85" fill="url(#fireLight)"/>
  <ellipse cx="300" cy="235" rx="110" ry="38" fill="url(#ashGlow)"/>

  <!-- ============================================================== -->
  <!-- ASH, BONES & CHARCOAL HEAP (THE SACRED CINDER BED)             -->
  <!-- ============================================================== -->
  <!-- Base Mound Shadow & Charcoal -->
  <ellipse cx="300" cy="254" rx="145" ry="36" fill="#171411"/>
  <ellipse cx="300" cy="250" rx="125" ry="28" fill="#241e18"/>

  <!-- Ash Mound Layers (Stepped Dark Fantasy Cinder Bed) -->
  <g fill="#332c23">
    <polygon points="180,260 210,238 390,238 420,260 380,272 220,272"/>
    <polygon points="205,248 230,228 370,228 395,248 360,262 240,262" fill="#42392e"/>
  </g>

  <!-- Glowing Ember Cracks in the Ash Bed -->
  <g fill="#d94e00">
    <rect x="235" y="246" width="18" height="3"/>
    <rect x="345" y="246" width="22" height="3"/>
    <rect x="270" y="254" width="24" height="3"/>
    <rect x="315" y="255" width="20" height="3"/>
    <rect x="250" y="238" width="14" height="3" fill="#ff7b00"/>
    <rect x="336" y="238" width="16" height="3" fill="#ff7b00"/>
    <rect x="290" y="248" width="20" height="4" fill="#ffba08"/>
  </g>

  <!-- Charred Wood Logs surrounding the base -->
  <g fill="#1a1612" stroke="#261f18" stroke-width="2">
    <!-- Left Angled Log -->
    <polygon points="195,252 255,232 260,242 200,262"/>
    <!-- Right Angled Log -->
    <polygon points="405,252 345,232 340,242 400,262"/>
    <!-- Center Cross Log -->
    <polygon points="240,258 360,258 358,268 242,268" fill="#120f0c"/>
  </g>

  <!-- Dark Souls Skulls & Bones Buried in Cinder -->
  <!-- Left Skull -->
  <g transform="translate(210, 244)">
    <polygon points="2,2 14,2 16,8 14,14 2,14 0,8" fill="#595044"/>
    <rect x="4" y="6" width="3" height="4" fill="#1a1612"/>
    <rect x="9" y="6" width="3" height="4" fill="#1a1612"/>
    <rect x="5" y="11" width="6" height="2" fill="#1a1612"/>
  </g>
  <!-- Right Skull -->
  <g transform="translate(372, 246)">
    <polygon points="2,2 14,2 16,8 14,14 2,14 0,8" fill="#595044"/>
    <rect x="4" y="6" width="3" height="4" fill="#1a1612"/>
    <rect x="9" y="6" width="3" height="4" fill="#1a1612"/>
    <rect x="5" y="11" width="6" height="2" fill="#1a1612"/>
  </g>

  <!-- ============================================================== -->
  <!-- THE COILED SWORD (SPIRAL BLADE OF THE BONFIRE)                 -->
  <!-- ============================================================== -->
  <g id="coiled-sword">
    <!-- Pommel & Hilt (Gilded Iron) -->
    <rect x="296" y="52" width="8" height="8" fill="#c9a876"/>
    <circle cx="300" cy="56" r="3" fill="#8a6f44"/>
    <rect x="297" y="60" width="6" height="18" fill="#2e271f"/>
    <rect x="298" y="64" width="4" height="4" fill="#661414"/>

    <!-- Twisted Crossguard -->
    <polygon points="274,78 326,78 322,86 278,86" fill="#8a6f44"/>
    <rect x="282" y="80" width="36" height="4" fill="#c9a876"/>
    <polygon points="274,78 268,74 278,82" fill="#5c4728"/>
    <polygon points="326,78 332,74 322,82" fill="#5c4728"/>

    <!-- THE SPIRAL BLADE (Iconic Helical Twist Plunging Into Ash) -->
    <!-- Segment 1: Cold upper steel -->
    <polygon points="296,86 304,86 308,102 300,102" fill="#756a59"/>
    <polygon points="300,86 304,86 308,102 304,102" fill="#a89b87"/>
    <!-- Segment 2: Spiral twist to left -->
    <polygon points="300,102 308,102 302,120 294,120" fill="#665b4c"/>
    <polygon points="294,120 302,120 306,138 298,138" fill="#7a6c58"/>
    <polygon points="302,120 306,120 306,138 302,138" fill="#baab95"/>
    <!-- Segment 3: Spiral twist back to right (Heating up) -->
    <polygon points="298,138 306,138 312,158 304,158" fill="#8c4327"/>
    <polygon points="304,138 306,138 312,158 310,158" fill="#c96f4b"/>
    <!-- Segment 4: Burning spiral into heart of fire -->
    <polygon points="304,158 312,158 304,180 296,180" fill="#b83800"/>
    <polygon points="308,158 312,158 304,180 300,180" fill="#f48222"/>
    <!-- Segment 5: Red-hot lower blade buried in ash -->
    <polygon points="296,180 304,180 302,238 298,238" fill="#d93800"/>
    <!-- Red-hot molten blade core -->
    <g class="blade-heat">
      <rect x="299" y="162" width="3" height="72" fill="#ffb833"/>
      <rect x="300" y="178" width="1" height="52" fill="#fff5cc"/>
    </g>
  </g>

  <!-- ============================================================== -->
  <!-- 4-STAGE ROARING PIXEL FLAME ANIMATION                          -->
  <!-- ============================================================== -->

  <!-- FLAME FRAME 1 -->
  <g class="f-layer-1">
    <!-- Outer Crimson/Cinder tongues -->
    <path d="M260,240 Q252,204 274,182 Q270,160 286,138 Q294,110 302,96 Q312,122 322,144 Q336,168 330,192 Q344,212 340,240 Z" fill="#8f1d00"/>
    <path d="M266,240 Q260,208 278,190 Q278,168 290,148 Q298,124 302,108 Q310,130 318,152 Q330,176 324,198 Q334,218 334,240 Z" fill="#c73800"/>
    <!-- Mid Blazing Amber/Orange -->
    <path d="M272,240 Q270,212 284,196 Q284,178 294,160 Q298,140 302,126 Q306,142 312,162 Q322,184 316,204 Q324,222 326,240 Z" fill="#f07100"/>
    <path d="M278,240 Q278,218 288,202 Q290,186 296,170 Q300,154 302,142 Q306,156 308,172 Q316,192 312,210 Q318,226 320,240 Z" fill="#fba100"/>
    <!-- Inner Thermal Gold/White Core -->
    <path d="M284,240 Q286,222 292,208 Q296,192 298,180 Q301,168 302,156 Q304,168 306,182 Q310,198 308,214 Q312,228 314,240 Z" fill="#ffdd55"/>
    <path d="M290,240 Q292,226 296,214 Q298,200 300,190 Q301,180 302,170 Q303,180 304,192 Q306,204 304,218 Q306,230 308,240 Z" fill="#fff9db"/>
    <!-- Spiraling Tongue curling around sword to right -->
    <polygon points="314,142 326,128 322,146" fill="#f07100"/>
    <polygon points="318,138 324,132 322,142" fill="#ffdd55"/>
  </g>

  <!-- FLAME FRAME 2 (Shifted dynamic licking tongues) -->
  <g class="f-layer-2">
    <!-- Outer Crimson/Cinder tongues -->
    <path d="M258,240 Q256,202 270,180 Q274,154 288,134 Q296,104 298,90 Q308,118 320,140 Q338,162 334,188 Q346,210 342,240 Z" fill="#8f1d00"/>
    <path d="M264,240 Q262,206 274,188 Q280,164 292,144 Q298,118 300,102 Q306,126 316,148 Q332,172 328,194 Q338,214 336,240 Z" fill="#c73800"/>
    <!-- Mid Blazing Amber/Orange -->
    <path d="M270,240 Q268,210 280,194 Q286,174 294,156 Q298,134 300,120 Q304,138 310,158 Q324,180 320,200 Q328,218 328,240 Z" fill="#f07100"/>
    <path d="M276,240 Q276,216 284,200 Q290,182 296,166 Q299,148 300,136 Q303,152 307,168 Q318,188 316,206 Q322,224 322,240 Z" fill="#fba100"/>
    <!-- Inner Thermal Gold/White Core -->
    <path d="M282,240 Q284,220 290,206 Q294,188 297,176 Q300,162 301,150 Q303,164 305,178 Q312,194 310,210 Q314,226 316,240 Z" fill="#ffdd55"/>
    <path d="M288,240 Q290,224 294,212 Q296,196 299,186 Q300,174 301,164 Q302,176 303,188 Q308,200 306,214 Q308,228 310,240 Z" fill="#fff9db"/>
    <!-- Spiraling Tongue curling around sword to left -->
    <polygon points="286,134 274,120 280,138" fill="#f07100"/>
    <polygon points="282,130 276,124 278,134" fill="#ffdd55"/>
  </g>

  <!-- FLAME FRAME 3 (Taller cresting tongues) -->
  <g class="f-layer-3">
    <!-- Outer Crimson/Cinder tongues -->
    <path d="M262,240 Q254,206 276,184 Q272,162 284,142 Q292,114 304,98 Q314,124 324,148 Q334,170 328,194 Q342,216 338,240 Z" fill="#8f1d00"/>
    <path d="M268,240 Q262,210 280,192 Q278,170 288,152 Q296,128 304,112 Q312,132 320,156 Q328,178 322,200 Q332,220 332,240 Z" fill="#c73800"/>
    <!-- Mid Blazing Amber/Orange -->
    <path d="M274,240 Q272,214 286,198 Q284,180 292,164 Q296,144 304,130 Q308,144 314,166 Q320,186 314,206 Q322,224 324,240 Z" fill="#f07100"/>
    <path d="M280,240 Q280,220 290,204 Q288,188 294,174 Q298,158 304,146 Q308,158 310,176 Q314,194 310,212 Q316,228 318,240 Z" fill="#fba100"/>
    <!-- Inner Thermal Gold/White Core -->
    <path d="M286,240 Q288,224 294,210 Q294,194 296,184 Q300,172 304,160 Q306,170 308,186 Q308,202 306,216 Q310,230 312,240 Z" fill="#ffdd55"/>
    <path d="M292,240 Q294,228 298,216 Q296,202 298,194 Q300,184 304,174 Q306,182 306,196 Q304,208 302,220 Q304,232 306,240 Z" fill="#fff9db"/>
    <!-- High ember lick -->
    <polygon points="302,94 306,82 308,98" fill="#fba100"/>
    <polygon points="303,90 305,84 306,92" fill="#fff9db"/>
  </g>

  <!-- FLAME FRAME 4 (Flaring base & split apex) -->
  <g class="f-layer-4">
    <!-- Outer Crimson/Cinder tongues -->
    <path d="M256,240 Q250,200 272,178 Q268,156 286,136 Q298,108 300,92 Q310,120 326,142 Q340,166 332,190 Q348,214 344,240 Z" fill="#8f1d00"/>
    <path d="M262,240 Q258,204 276,186 Q276,166 290,146 Q300,122 300,106 Q308,128 322,150 Q334,174 326,196 Q340,216 338,240 Z" fill="#c73800"/>
    <!-- Mid Blazing Amber/Orange -->
    <path d="M268,240 Q266,208 282,192 Q282,176 294,158 Q300,138 300,124 Q304,140 316,160 Q326,182 318,202 Q330,220 330,240 Z" fill="#f07100"/>
    <path d="M274,240 Q274,214 286,198 Q288,184 296,168 Q300,152 300,140 Q304,154 312,170 Q320,190 314,208 Q324,224 324,240 Z" fill="#fba100"/>
    <!-- Inner Thermal Gold/White Core -->
    <path d="M280,240 Q282,218 290,204 Q294,190 298,178 Q300,166 300,154 Q302,166 306,180 Q314,196 310,212 Q316,226 318,240 Z" fill="#ffdd55"/>
    <path d="M286,240 Q288,222 294,210 Q296,198 298,188 Q300,178 300,168 Q301,178 303,190 Q308,202 304,216 Q308,228 312,240 Z" fill="#fff9db"/>
    <!-- Split tongue to right -->
    <polygon points="320,152 334,136 328,158" fill="#f07100"/>
    <polygon points="324,148 332,140 328,154" fill="#ffdd55"/>
  </g>

  <!-- ============================================================== -->
  <!-- RISING SMOKE & CINDER EMBERS                                   -->
  <!-- ============================================================== -->
  <!-- Translucent Dark Grey Smoke Puffs -->
  <g fill="#211c17">
    <ellipse class="smoke-puff-1" cx="295" cy="115" rx="14" ry="10"/>
    <ellipse class="smoke-puff-2" cx="310" cy="100" rx="18" ry="12"/>
  </g>

  <!-- Glowing Ascending Ember Sparks -->
  <g fill="#ffba08">
    <rect class="ember-1" x="285" y="210" width="3" height="3"/>
    <rect class="ember-2" x="315" y="205" width="4" height="4" fill="#fff5cc"/>
    <rect class="ember-3" x="295" y="195" width="3" height="3"/>
    <rect class="ember-4" x="325" y="190" width="3" height="3" fill="#ff7b00"/>
    <rect class="ember-5" x="275" y="200" width="4" height="4"/>
    <rect class="ember-6" x="305" y="185" width="3" height="3" fill="#fff5cc"/>
    <rect class="ember-7" x="335" y="195" width="3" height="3"/>
  </g>

  <!-- ============================================================== -->
  <!-- GOTHIC CINDER INSCRIPTION & TITLE (TOP)                        -->
  <!-- ============================================================== -->
  <g class="text-lit" transform="translate(300, 36)">
    <!-- Flanking Golden Medallion Diamonds -->
    <polygon points="-120,-4 -112,-11 -104,-4 -112,3" fill="#c9a876"/>
    <polygon points="-114,-4 -112,-7 -110,-4 -112,-1" fill="#fff5cc"/>
    <line x1="-100" y1="-4" x2="-75" y2="-4" stroke="#8a6f44" stroke-width="1.5"/>

    <!-- Main Title -->
    <text x="0" y="0" font-family="'Press Start 2P', ui-monospace, Consolas, monospace" font-size="12" letter-spacing="4" fill="#f4a742" text-anchor="middle">🔥 BONFIRE LIT 🔥</text>

    <!-- Right Flank -->
    <line x1="75" y1="-4" x2="100" y2="-4" stroke="#8a6f44" stroke-width="1.5"/>
    <polygon points="120,-4 112,-11 104,-4 112,3" fill="#c9a876"/>
    <polygon points="114,-4 112,-7 110,-4 112,-1" fill="#fff5cc"/>
  </g>

  <!-- Gothic Subtitle -->
  <text x="300" y="320" font-family="'Press Start 2P', ui-monospace, Consolas, monospace" font-size="8" letter-spacing="3" fill="#8a735c" text-anchor="middle">COILED SWORD · SANCTUARY OF ASH · RESTORE HUMANITY</text>
</svg>