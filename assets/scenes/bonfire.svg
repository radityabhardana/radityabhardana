<svg width="600" height="300" viewBox="0 0 600 300" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">
  <style>
    .fA { animation: fa 0.7s step-end infinite; }
    .fB { animation: fb 0.7s step-end infinite; }
    @keyframes fa { 0% {opacity:1;} 50% {opacity:0;} 100% {opacity:1;} }
    @keyframes fb { 0% {opacity:0;} 50% {opacity:1;} 100% {opacity:0;} }
    .hA,.hB,.hC,.hD,.hE { animation-timing-function: step-end; animation-iteration-count: infinite; }
    @keyframes hopA { 0% {opacity:0;transform:translate(0,0);} 10% {opacity:.95;} 25% {transform:translate(-6px,-30px);} 50% {opacity:.6;transform:translate(-12px,-66px);} 75% {transform:translate(-12px,-108px);} 100% {opacity:0;transform:translate(-18px,-150px);} }
    .hA { animation-name: hopA; }
    @keyframes hopB { 0% {opacity:0;transform:translate(0,0);} 10% {opacity:.95;} 25% {transform:translate(6px,-30px);} 50% {opacity:.6;transform:translate(12px,-66px);} 75% {transform:translate(12px,-108px);} 100% {opacity:0;transform:translate(18px,-150px);} }
    .hB { animation-name: hopB; }
    @keyframes hopC { 0% {opacity:0;transform:translate(0,0);} 10% {opacity:.95;} 25% {transform:translate(0,-36px);} 50% {opacity:.6;transform:translate(6px,-78px);} 75% {transform:translate(0,-120px);} 100% {opacity:0;transform:translate(6px,-162px);} }
    .hC { animation-name: hopC; }
    @keyframes hopD { 0% {opacity:0;transform:translate(0,0);} 10% {opacity:.9;} 25% {transform:translate(-6px,-24px);} 50% {opacity:.55;transform:translate(-12px,-54px);} 75% {transform:translate(-18px,-90px);} 100% {opacity:0;transform:translate(-18px,-126px);} }
    .hD { animation-name: hopD; }
    @keyframes hopE { 0% {opacity:0;transform:translate(0,0);} 10% {opacity:.9;} 25% {transform:translate(6px,-24px);} 50% {opacity:.55;transform:translate(12px,-54px);} 75% {transform:translate(18px,-90px);} 100% {opacity:0;transform:translate(18px,-126px);} }
    .hE { animation-name: hopE; }
    .a1 { animation: ashf 7s step-end infinite .5s; }
    .a2 { animation: ashf 9s step-end infinite 2.4s; }
    .a3 { animation: ashf 8s step-end infinite 4.8s; }
    .a4 { animation: ashf 6.5s step-end infinite 3.1s; }
    .a5 { animation: ashf 10s step-end infinite 1.6s; }
    @keyframes ashf { 0% {opacity:0;transform:translate(0,0);} 15% {opacity:.3;} 45% {transform:translate(6px,60px);} 75% {opacity:.2;transform:translate(12px,132px);} 100% {opacity:0;transform:translate(12px,200px);} }
    .sm1 { animation: rise 7s step-end infinite 0s; }
    .sm2 { animation: rise 8s step-end infinite 2.5s; }
    .sm3 { animation: rise 9s step-end infinite 5s; }
    @keyframes rise { 0% {opacity:0;transform:translateY(0);} 20% {opacity:.2;} 40% {transform:translateY(-24px);} 60% {opacity:.14;transform:translateY(-48px);} 80% {opacity:.07;transform:translateY(-78px);} 100% {opacity:0;transform:translateY(-108px);} }
    .fogA { animation: fogd 14s step-end infinite; }
    .fogB { animation: fogd 11s step-end infinite reverse; }
    @keyframes fogd { 0% {transform:translateX(0);opacity:.5;} 50% {transform:translateX(6px);opacity:1;} 100% {transform:translateX(0);opacity:.5;} }
    .em2 { animation: emblink 1.5s step-end infinite; }
    @keyframes emblink { 0% {opacity:1;} 33% {opacity:.45;} 66% {opacity:.12;} 100% {opacity:1;} }
    .bglow { animation: bgpulse 1.1s step-end infinite; }
    @keyframes bgpulse { 0% {opacity:.35;} 50% {opacity:.12;} 100% {opacity:.35;} }
  </style>

  <!-- ABYSS -->
  <rect width="600" height="300" fill="#0d0d0d"/>

  <!-- RUIN SKYLINE (far, low opacity) -->
