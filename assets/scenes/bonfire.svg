  <rect x="294" y="54" width="12" height="6" fill="#8a7455"/>
  <rect x="294" y="66" width="12" height="18" fill="#3a2f1f"/>
  <rect x="294" y="72" width="12" height="6" fill="#6e0d0d"/>
  <rect x="294" y="78" width="12" height="6" fill="#6e0d0d"/>
  <rect x="264" y="84" width="12" height="6" fill="#8a7455"/>
  <rect x="324" y="84" width="12" height="6" fill="#8a7455"/>
  <rect x="264" y="90" width="72" height="12" fill="#8a7455"/>
