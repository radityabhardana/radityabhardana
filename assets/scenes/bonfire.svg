  <rect x="252" y="240" width="96" height="6" fill="#242019"/>
  <rect x="246" y="246" width="108" height="6" fill="#242019"/>
  <rect x="240" y="252" width="120" height="6" fill="#242019"/>
  <g fill="#3a2f1f">
