<svg xmlns="http://www.w3.org/2000/svg" width="890" height="150" viewBox="0 0 890 150" shape-rendering="crispEdges">
  <title>Engineering Codex &amp; Activity Summary — radityabhardana</title>

  <style>
    .px-title {
      font-family: 'Press Start 2P', ui-monospace, monospace;
      font-size: 11px;
      letter-spacing: 0.8px;
      fill: #f0f6fc;
    }
    .px-tag {
      font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
      font-size: 10px;
      fill: #8b949e;
    }
    .px-stat-num {
      font-family: 'Press Start 2P', ui-monospace, monospace;
      font-size: 16px;
      letter-spacing: 0.5px;
      fill: #f0f6fc;
    }
    .px-stat-label {
      font-family: 'Press Start 2P', ui-monospace, monospace;
      font-size: 8.5px;
      letter-spacing: 0.8px;
      fill: #c9a876;
    }
    .px-stat-sub {
      font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
      font-size: 10.5px;
      fill: #8b949e;
    }
    .px-lang-item {
      font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
      font-size: 10.5px;
      fill: #c9d1d9;
    }
    .px-lang-pct {
      fill: #8b949e;
      font-size: 9.5px;
    }
  </style>

  <!-- Pixel Stone Frame -->
  
    <rect x="0" y="0" width="890" height="150" fill="#111418"/>
    <rect x="0" y="0" width="890" height="150" fill="none" stroke="#262c35" stroke-width="2"/>
    <rect x="3" y="3" width="884" height="144" fill="none" stroke="#181c22" stroke-width="1"/>
    <!-- Antique Gold Pixel Corner Rivets -->
    <rect x="2" y="2" width="3" height="3" fill="#c9a876"/>
    <rect x="5" y="2" width="2" height="2" fill="#8a6833"/>
    <rect x="2" y="5" width="2" height="2" fill="#8a6833"/>

    <rect x="885" y="2" width="3" height="3" fill="#c9a876"/>
    <rect x="883" y="2" width="2" height="2" fill="#8a6833"/>
    <rect x="885" y="5" width="2" height="2" fill="#8a6833"/>

    <rect x="2" y="145" width="3" height="3" fill="#c9a876"/>
    <rect x="5" y="146" width="2" height="2" fill="#8a6833"/>
    <rect x="2" y="143" width="2" height="2" fill="#8a6833"/>

    <rect x="885" y="145" width="3" height="3" fill="#c9a876"/>
    <rect x="883" y="146" width="2" height="2" fill="#8a6833"/>
    <rect x="885" y="143" width="2" height="2" fill="#8a6833"/>
    <!-- Top Pixel Shimmer Line -->
    <rect x="16" y="1" width="858" height="1" fill="#4d3a1f"/>
    <rect x="385" y="1" width="120" height="1" fill="#c9a876"/>
    <rect x="425" y="1" width="40" height="1" fill="#fff5cc"/>
  

  <!-- Header Row -->
  <g transform="translate(24, 22)">
    <rect x="0" y="0" width="3" height="3" fill="#e3b341"/>
    <rect x="3" y="-3" width="3" height="3" fill="#fff5cc"/>
    <rect x="3" y="3" width="3" height="3" fill="#8a6833"/>
    <rect x="6" y="0" width="3" height="3" fill="#e3b341"/>

    <text x="18" y="4" class="px-title">SYSTEM CODEX &amp; PRODUCTION ARCHIVE</text>
    <text x="842" y="4" text-anchor="end" class="px-tag">radityabhardana · 2026 ARCHIVE</text>
  </g>

  <!-- Horizontal Pixel Divider with Diamond Accent -->
  <rect x="20" y="36" width="850" height="1" fill="#1e242d"/>
  <rect x="443" y="35" width="4" height="3" fill="#c9a876"/>

  <!-- ================= COLUMN 1: TOTAL SOULS (CONTRIBUTIONS) ================= -->
  <g transform="translate(30, 52)">
    <text x="0" y="24" class="px-stat-num">679+</text>
    <text x="0" y="46" class="px-stat-label">&gt; TOTAL SOULS</text>
    <text x="0" y="68" class="px-stat-sub">365-day active cadence</text>
  </g>

  <!-- Vertical Pixel Divider 1 -->
  <rect x="210" y="48" width="1" height="82" fill="#1e242d"/>

  <!-- ================= COLUMN 2: PRODUCTION COMMITS ================= -->
  <g transform="translate(235, 52)">
    <text x="0" y="24" class="px-stat-num">291+</text>
    <text x="0" y="46" class="px-stat-label">&gt; PROD COMMITS</text>
    <text x="0" y="68" class="px-stat-sub">Deterministic backend pushes</text>
  </g>

  <!-- Vertical Pixel Divider 2 -->
  <rect x="410" y="48" width="1" height="82" fill="#1e242d"/>

  <!-- ================= COLUMN 3: DISCIPLINE GRADE ================= -->
  <g transform="translate(435, 52)">
    <text x="0" y="24" class="px-stat-num">
      <tspan fill="#e3b341">[ A+ ]</tspan>
    </text>
    <text x="0" y="46" class="px-stat-label">&gt; DISCIPLINE</text>
    <text x="0" y="68" class="px-stat-sub">Top-tier daily cadence</text>
  </g>

  <!-- Vertical Pixel Divider 3 -->
  <rect x="580" y="48" width="1" height="82" fill="#1e242d"/>

  <!-- ================= COLUMN 4: ARSENAL SHARE ================= -->
  <g transform="translate(605, 52)">
    <text x="0" y="6" class="px-stat-label">&gt; ARSENAL SHARE</text>

    <!-- Stepped Pixel Bar (260px wide, 8px high) -->
    <g transform="translate(0, 16)">
      <rect x="0" y="0" width="260" height="8" fill="#090c10"/>
      <rect x="0" y="0" width="260" height="8" fill="none" stroke="#262c35" stroke-width="1"/>
      <rect x="1" y="1" width="80" height="6" fill="#f1e05a"/><rect x="81" y="1" width="65" height="6" fill="#3178c6"/><rect x="146" y="1" width="57" height="6" fill="#563d7c"/><rect x="203" y="1" width="34" height="6" fill="#178600"/><rect x="237" y="1" width="22" height="6" fill="#777bb4"/>
    </g>

    <!-- Dynamic Legend -->
    <g transform="translate(0, 44)">
      <rect x="0" y="-4" width="5" height="5" fill="#f1e05a"/>
      <text x="9" y="1" class="px-lang-item">JS <tspan class="px-lang-pct">31%</tspan></text>
    
      <rect x="74" y="-4" width="5" height="5" fill="#3178c6"/>
      <text x="83" y="1" class="px-lang-item">TS <tspan class="px-lang-pct">25%</tspan></text>
    
      <rect x="148" y="-4" width="5" height="5" fill="#563d7c"/>
      <text x="157" y="1" class="px-lang-item">CSS <tspan class="px-lang-pct">22%</tspan></text>
    </g><g transform="translate(0, 64)">
        <rect x="0" y="-4" width="5" height="5" fill="#178600"/>
        <text x="9" y="1" class="px-lang-item">C# <tspan class="px-lang-pct">13%</tspan></text>
      
        <rect x="74" y="-4" width="5" height="5" fill="#777bb4"/>
        <text x="83" y="1" class="px-lang-item">PHP <tspan class="px-lang-pct">9%</tspan></text>
      </g>
  </g>
</svg>
