<svg xmlns="http://www.w3.org/2000/svg" width="900" height="110" viewBox="0 0 900 110" shape-rendering="crispEdges">
  <title>Raditya Bagus Hardana — Full-Stack Developer &amp; Automation Specialist</title>
  <defs>
    <!-- Left Tapering Wing -->
    <linearGradient id="bFadeL" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c9a876" stop-opacity="0"/>
      <stop offset="60%" stop-color="#8a7455" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#f4a742" stop-opacity="1"/>
    </linearGradient>
    <!-- Right Tapering Wing -->
    <linearGradient id="bFadeR" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f4a742" stop-opacity="1"/>
      <stop offset="40%" stop-color="#8a7455" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#c9a876" stop-opacity="0"/>
    </linearGradient>
    <!-- Golden Title Gradient -->
    <linearGradient id="titleGold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff8e7"/>
      <stop offset="35%" stop-color="#f4a742"/>
      <stop offset="100%" stop-color="#c9a876"/>
    </linearGradient>
  </defs>

  <style>
    .b-pulse { animation: bPulse 2.8s ease-in-out infinite; }
    @keyframes bPulse {
      0%, 100% { opacity: 0.7; }
      50% { opacity: 1; }
    }
  </style>

  <!-- Top Center Ornamental Crest -->
  <g class="b-pulse">
    <polygon points="450,5 458,13 450,21 442,13" fill="#f4a742"/>
    <polygon points="450,8 454,13 450,18 446,13" fill="#fff8e7"/>
  </g>

  <!-- Left Horizontal Ornamental Wing -->
  <line x1="30" y1="56" x2="140" y2="56" stroke="url(#bFadeL)" stroke-width="2"/>
  <rect x="144" y="54" width="4" height="4" fill="#f4a742"/>
  <rect x="152" y="53" width="6" height="6" fill="#c9a876"/>
  <rect x="162" y="52" width="8" height="8" fill="#f4a742"/>
  <line x1="174" y1="56" x2="194" y2="56" stroke="#f4a742" stroke-width="2"/>

  <!-- Right Horizontal Ornamental Wing -->
  <line x1="706" y1="56" x2="726" y2="56" stroke="#f4a742" stroke-width="2"/>
  <rect x="730" y="52" width="8" height="8" fill="#f4a742"/>
  <rect x="742" y="53" width="6" height="6" fill="#c9a876"/>
  <rect x="752" y="54" width="4" height="4" fill="#f4a742"/>
  <line x1="760" y1="56" x2="870" y2="56" stroke="url(#bFadeR)" stroke-width="2"/>

  <!-- Main Name Title (Prominent, Grand & Cinematic) -->
  <text x="450" y="61" font-family="'Press Start 2P', ui-monospace, monospace" font-size="22" letter-spacing="5" fill="url(#titleGold)" text-anchor="middle">RADITYA BAGUS HARDANA</text>

  <!-- Accent Divider Line -->
  <line x1="280" y1="74" x2="620" y2="74" stroke="#3a2f1f" stroke-width="1.2"/>
  <rect x="447" y="71" width="6" height="6" fill="#c9a876"/>

  <!-- Subtitle (Clear, Sharp & High Readability) -->
  <text x="450" y="94" font-family="ui-monospace, Consolas, monospace" font-size="12.5" font-weight="700" letter-spacing="4" fill="#c9a876" text-anchor="middle">FULL-STACK DEVELOPER · AUTOMATION SPECIALIST</text>
</svg>
