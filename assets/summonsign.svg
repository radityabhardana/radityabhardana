<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="400" height="120">
  <style>
    .ring { stroke: #c9a876; fill: none; }
    .ring1 { animation: ring1 3.6s ease-in-out infinite; }
    .ring2 { animation: ring2 3.6s ease-in-out infinite; animation-delay: .45s; }
    .ring3 { animation: ring3 4.2s ease-in-out infinite; animation-delay: .9s; }
    .core { fill: #0d0d0d; stroke: #f4a742; animation: core 2.4s ease-in-out infinite; }
    .shine { fill: none; stroke: #f4a742; animation: shine 3s linear infinite; }
    @keyframes ring1 { 0%,100% { opacity: .25; } 50% { opacity: .6; } }
    @keyframes ring2 { 0%,100% { opacity: .6; } 50% { opacity: .2; } }
    @keyframes ring3 { 0%,100% { opacity: .35; } 50% { opacity: .75; } }
    @keyframes core { 0%,100% { filter: none; } 50% { filter: none; } }
    @keyframes shine {
      0%   { stroke-dasharray: 0 600; }
      60%, 100% { stroke-dasharray: 600 0; }
    }
  </style>

  <g transform="translate(200 60)">
    <!-- outer glow -->
    <ellipse cx="0" cy="0" rx="150" ry="46" fill="none" stroke="#f4a742" stroke-width="14" opacity=".06" class="ring1"/>

    <!-- concentric summon rings -->
    <ellipse class="ring1" cx="0" cy="0" rx="132" ry="40" stroke-width="5"/>
    <ellipse class="ring2" cx="0" cy="0" rx="102" ry="30" stroke-width="4"/>
    <ellipse class="ring3" cx="0" cy="0" rx="74" ry="22" stroke-width="3"/>

    <!-- shimmer sweep -->
    <path class="shine" d="M-120 0 A 132 40 0 0 1 120 0" stroke-width="2" stroke-dasharray="0 600"/>

    <!-- runic core -->
    <rect x="-34" y="-20" width="68" height="40" rx="6" class="core"/>
    <g stroke="#cfcfcf" stroke-width="2.5" stroke-linecap="round" transform="scale(.9)">
      <path d="M-24 -8l8 8 -8 8M-10 -8l10 16M8 -8l-6 16M8 -8l6 0M2 0l10 0M8 8l6 0" />
    </g>
  </g>
</svg>